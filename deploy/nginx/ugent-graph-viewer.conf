# nginx static server for ugent-graph-viewer
#
# Serves the Vite `dist/` build over TLS on its own subdomain. The viewer is
# a pure client-side SPA with NO backend and NO secrets: it learns the
# console origin from the postMessage handshake at runtime, then talks to the
# console's CORS-scoped /api/graph/* routes directly from the browser.
#
# Install:
#   sudo cp deploy/nginx/ugent-graph-viewer.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/ugent-graph-viewer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Files live at /opt/ugent/viewer (owned by ugent:ugent). nginx's worker
# user only needs READ + directory-execute; see deploy/install.sh, which
# sets 0755 dirs / 0644 files and never grants write to the web server.

server {
    listen 80;
    listen [::]:80;
    server_name graph.example.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name graph.example.com;

    ssl_certificate     /etc/letsencrypt/live/graph.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/graph.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # IMPORTANT: do NOT set `Cross-Origin-Opener-Policy: same-origin` here.
    # The viewer must keep `window.opener` to run the postMessage handshake
    # back to the console; a restrictive COOP silently breaks the handoff.

    root /opt/ugent/viewer;
    index index.html;

    # Long-cache the fingerprinted assets Vite emits under /assets/.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: deep links like /?node=<id> use the query string, but
    # this also covers any client-side path. HTML itself must not be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
